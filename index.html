<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skytumble</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800;900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="stage"></div>

    <header class="top">
      <div class="brand">
        <h1>Skytumble</h1>
        <p id="level-info"></p>
      </div>
      <nav class="tabs" id="tabs">
        <button data-mode="easy">Easy</button>
        <button data-mode="medium">Medium</button>
        <button data-mode="ref">Handmade</button>
      </nav>
      <div class="score card">
        <div><span class="label">Moves</span><span id="moves">0</span></div>
        <div><span class="label">Par</span><span id="par">–</span></div>
        <div><span class="label">Best</span><span id="best" class="stars">–</span></div>
      </div>
    </header>

    <footer class="bottom">
      <div class="actions">
        <button id="btn-new">New level <kbd>N</kbd></button>
        <button id="btn-restart">Restart <kbd>R</kbd></button>
        <button id="btn-undo">Undo <kbd>Z</kbd></button>
        <button id="btn-link">Copy link</button>
        <button id="btn-stats">Stats</button>
      </div>
      <p class="help"><kbd>←↑↓→</kbd>/<kbd>WASD</kbd> roll · <kbd>Q</kbd>/<kbd>E</kbd> rotate view</p>
    </footer>

    <div id="toast" class="toast"></div>
    <div id="loading" class="loading">Building islands…</div>

    <div id="win" class="modal hidden">
      <div class="card dialog">
        <h2>Landed!</h2>
        <div id="win-stars" class="big-stars"></div>
        <p id="win-detail"></p>
        <div class="dialog-actions">
          <button id="win-retry">Retry <kbd>R</kbd></button>
          <button id="win-next" class="primary">Next level <kbd>Enter</kbd></button>
        </div>
      </div>
    </div>

    <div id="stats" class="modal hidden">
      <div class="card dialog">
        <h2>Your progress</h2>
        <table id="stats-table"></table>
        <div class="dialog-actions">
          <button id="stats-close" class="primary">Close</button>
        </div>
      </div>
    </div>

    <!-- Visible until the game starts, so a failed start is never silent. -->
    <div id="boot" class="modal">
      <div class="card dialog boot">
        <h2>Starting Skytumble…</h2>
        <p id="boot-detail">
          If this message doesn't go away, make sure you opened the <code>http://localhost</code> link that
          <code>npm run dev</code> printed, not the <code>index.html</code> file itself.
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
